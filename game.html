<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Details — FreeGameHub</title><link rel="stylesheet" href="style.css">
<style>.detail{max-width:850px;margin:70px auto}.back{color:var(--muted);display:inline-block;margin-bottom:25px}.detail-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}.detail-head{display:flex;gap:22px;align-items:center}.detail-icon{width:100px;height:100px;border-radius:22px;background:#17283a;display:grid;place-items:center;font-size:50px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}.fact{background:#0a151f;border:1px solid var(--line);padding:15px;border-radius:13px}.fact small{display:block;color:var(--muted);margin-bottom:5px}.detail-desc{color:var(--muted);line-height:1.8}.download-big{display:inline-block;background:var(--accent);color:#06120e;font-weight:900;padding:14px 22px;border-radius:12px;margin-top:10px}@media(max-width:600px){.facts{grid-template-columns:1fr}.detail-head{align-items:flex-start}.detail-icon{width:78px;height:78px;font-size:38px}}</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span>🎮</span> FreeGameHub</a><nav><a href="index.html#games">Games</a><a href="index.html#categories">Categories</a></nav></header>
<main class="detail"><a class="back" href="index.html">← Back to games</a><div id="content"></div></main>
<script src="script.js"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
const game=games.find(g=>g.id===id)||games[0];
document.title=game.name+" — FreeGameHub";
document.getElementById("content").innerHTML=`
<div class="detail-card">
<div class="detail-head"><div class="detail-icon">${game.icon}</div><div><p class="eyebrow">${game.category}</p><h1 style="font-size:42px;letter-spacing:-2px;margin:0">${game.name}</h1></div></div>
<div class="facts"><div class="fact"><small>Version</small><strong>${game.version}</strong></div><div class="fact"><small>Size</small><strong>${game.size}</strong></div><div class="fact"><small>Android</small><strong>${game.android}</strong></div></div>
<h2>About this game</h2><p class="detail-desc">${game.description}</p>
<p class="detail-desc">This is a directory listing. Before publishing, make sure you have permission to distribute or link to this game.</p>
<a class="download-big" href="${game.download}" target="_blank" rel="noopener">Download from authorized source ↗</a>
</div>`;
</script>
</body></html>
